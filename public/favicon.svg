<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="64" height="64" rx="16" fill="#030712"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M 8 20 H 56 M 8 32 H 56 M 8 44 H 56 M 20 8 V 56 M 32 8 V 56 M 44 8 V 56" 
        stroke="#1e293b" stroke-width="0.75" opacity="0.4"/>

  <!-- Outer Cyber Shield Glow -->
  <path d="M 32 9 L 51 17 C 51 34 43 47 32 54 C 21 47 13 34 13 17 Z" 
        fill="url(#shieldBg)" stroke="url(#neonGlow)" stroke-width="2.5" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Cyber Contour -->
  <path d="M 32 15 L 46 21 C 46 33 40 43 32 48 C 24 43 18 33 18 21 Z" 
        fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>

  <!-- High-Tech Central Crosshair / Eye / Core -->
  <circle cx="32" cy="30" r="7" fill="#0f172a" stroke="url(#coreGlow)" stroke-width="1.8"/>
  <circle cx="32" cy="30" r="3" fill="#38bdf8"/>
  
  <!-- Optical Radar Radiating Beams -->
  <line x1="32" y1="19" x2="32" y2="23" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="37" x2="32" y2="41" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21" y1="30" x2="25" y2="30" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="39" y1="30" x2="43" y2="30" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Corner Tech Accents -->
  <circle cx="32" cy="11" r="1.5" fill="#67e8f9"/>
  <circle cx="32" cy="52" r="1.5" fill="#67e8f9"/>
</svg>
